name: Deploy MTS Hospital

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy-heroku:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    # Only run if HEROKU_API_KEY is set
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.14
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          
  validate:
    name: Validate PHP Syntax
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          
      - name: Validate PHP files
        run: |
          find . -name "*.php" -exec php -l {} \;
          
      - name: Check file encodings
        run: |
          file -bi index.php
          file -bi test_language.php
          
  create-release:
    name: Create Release Package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Create deployment package
        run: |
          zip -r mts-hospital-${{ github.ref_name }}.zip \
            index.php \
            test_language.php \
            .htaccess \
            composer.json \
            Procfile \
            README.md \
            GITHUB_DEPLOYMENT.md \
            DEPLOY_TO_LIVE.md \
            DEPLOYMENT_GUIDE.md \
            START_HERE.md \
            TROUBLESHOOTING.md
            
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: mts-hospital-${{ github.ref_name }}.zip
          body: |
            ## MTS Hospital Website Release
            
            ### What's Included:
            - ✅ index.php (main website)
            - ✅ test_language.php (testing utility)
            - ✅ .htaccess (Apache config)
            - ✅ Heroku deployment files
            - ✅ Complete documentation
            
            ### Quick Deploy:
            1. Download the zip file
            2. Extract files
            3. Upload to your PHP hosting
            4. Test language switching
            
            See DEPLOY_TO_LIVE.md for detailed instructions.
